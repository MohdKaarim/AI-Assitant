<div class="tutor-container container">
  <header class="header">
    <nav class="top-nav">
      <a routerLink="/home" class="home-link">
        <svg viewBox="0 0 24 24" fill="none" class="home-icon">
          <path d="M3 12L5 10M5 10L12 3L19 10M5 10V20C5 20.5523 5.44772 21 6 21H9M19 10L21 12M19 10V20C19 20.5523 18.5523 21 18 21H15M9 21V12C9 11.4477 9.44772 11 10 11H14C14.5523 11 15 11.4477 15 12V21M9 21H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Home
      </a>
    </nav>
    <h1>Quran Pronunciation Tutor</h1>
    <p>Perfect your recitation with AI-powered feedback</p>
  </header>

  <!-- Surah Selection -->
  <app-surah-list 
    *ngIf="!selectedSurahNumber"
    (surahSelected)="onSurahSelected($event)">
  </app-surah-list>

  <!-- Verse Display and Practice -->
  <div *ngIf="selectedSurahNumber" class="practice-area">
    <div class="nav-controls">
      <button class="back-btn" (click)="backToSurahList()">
        ← Back to Surah List
      </button>
      <button 
        class="next-surah-btn" 
        (click)="nextSurah()"
        *ngIf="selectedSurahNumber">
        Next Surah →
      </button>
    </div>
    
    <app-verse-display 
      [surahNumber]="selectedSurahNumber">
    </app-verse-display>
  </div>
</div>
